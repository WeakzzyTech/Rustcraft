[package]
name = "ingame-test"
description = "Runs rustcraft's in-game test scripts against a local vanilla server."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
flate2 = "1"
md-5 = "0.11"
rustcraft-protocol = { path = "../../rustcraft-protocol" }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
toml = "1"
uuid = "1"
